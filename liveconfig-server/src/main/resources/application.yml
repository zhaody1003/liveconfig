server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: liveconfig-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/liveconfig?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    # 口令不写进仓库：由 scripts/run-all.sh 从 infra/.env 导出为环境变量
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: liveconfig-pool
      maximum-pool-size: 10
      connection-timeout: 5000

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.z.liveconfig.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  level:
    com.z.liveconfig: debug
